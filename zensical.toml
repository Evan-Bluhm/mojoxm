# ============================================================================
# mojoxm documentation site
#
# Built with Zensical: https://zensical.org/
#
# Local preview:
#     pip install zensical
#     zensical serve              # http://localhost:8000
#
# Production build:
#     zensical build              # outputs to ./site/
# ============================================================================

[project]
site_name = "mojoxm"
site_description = "GPU-accelerated discontinuous Galerkin hyperbolic solver in Mojo"
site_author = "mojoxm contributors"
site_url = "https://mojoxm.dev/"

repo_url = "https://github.com/EvanBluhm/mojoxm"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; 2026 mojoxm contributors &middot;
Built with <a href="https://zensical.org/">Zensical</a>
"""

docs_dir = "docs"
site_dir = "site"

# Site-wide MathJax (math is everywhere in this project, so it's worth the
# global include rather than per-page <script> tags).
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# Hierarchical sidebar that mirrors the docs/ directory but with
# friendlier section names than the file slugs would produce.
nav = [
    { "Home" = "index.md" },
    { "Getting started" = [
        "getting-started/index.md",
        "getting-started/installation.md",
        "getting-started/your-first-simulation.md",
        "getting-started/quickstart.md",
    ] },
    { "Architecture" = [
        "architecture/index.md",
        "architecture/numerical-scheme.md",
        "architecture/physics-trait.md",
        "architecture/2d-vs-3d.md",
        "architecture/data-flow.md",
    ] },
    { "Physics" = [
        "physics/index.md",
        "physics/advection.md",
        "physics/euler.md",
        "physics/shallow-water.md",
        "physics/maxwell.md",
        "physics/mhd.md",
        "physics/two-fluid.md",
    ] },
    { "Usage" = [
        "usage/index.md",
        "usage/building.md",
        "usage/examples.md",
        "usage/benchmarks.md",
        "usage/profiling.md",
        "usage/visualization.md",
    ] },
    { "Reference" = [
        "reference/index.md",
        "reference/boundary-conditions.md",
        "reference/limiter.md",
        "reference/diagnostics.md",
        "reference/source-terms.md",
    ] },
    { "Contributing" = "contributing.md" },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
language = "en"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
logo = "lucide/atom"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# ----------------------------------------------------------------------------
# Social links rendered in the footer
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/EvanBluhm/mojoxm"
name = "mojoxm on GitHub"

[[project.extra.social]]
icon = "fontawesome/solid/book"
link = "https://docs.modular.com/mojo/"
name = "Mojo language documentation"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
